; TinyG HIL switchbox: Adafruit Feather HUZZAH ESP8266 emulating limit/homing switch contacts.
; Every platform, framework and library version is pinned exactly; bump them deliberately.
;
;   pio run                                        build
;   pio run -t upload --upload-port <port>         flash (the CP2104 auto-reset enters the bootloader)
;
; The API spec ../openapi.json and the web UI src/ui/index.html are embedded at build time by
; scripts/embed_assets.py into src/generated/assets.h (not committed).

[platformio]
default_envs = huzzah

[env:huzzah]
platform = platformio/espressif8266@4.2.1
platform_packages = platformio/framework-arduinoespressif8266@3.30102.0
board = huzzah
framework = arduino
board_build.f_cpu = 160000000L
board_build.ldscript = eagle.flash.4m2m.ld
board_build.filesystem = littlefs
upload_speed = 460800
upload_resetmethod = nodemcu
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    bblanchon/ArduinoJson@7.4.3
    links2004/WebSockets@2.7.3
build_flags =
    -Wall
    -Wextra
    -DARDUINOJSON_USE_LONG_LONG=1
    -DWEBSOCKETS_SERVER_CLIENT_MAX=3
build_src_flags =
    -Werror
extra_scripts = pre:scripts/embed_assets.py
