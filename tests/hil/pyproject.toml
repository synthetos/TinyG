[project]
name = "tinyg-hil"
version = "0.1.0"
description = "Hardware-in-the-loop tests for TinyG firmware over the USB serial port"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pymcuprog>=3.19",      # Atmel-ICE access (pyedbglib) for tinyg_hil.ice
    "pyusb>=1.2",
    "pyelftools>=0.31",     # ELF symbols and DWARF members for peek/poke
]

[project.optional-dependencies]
evidence = ["matplotlib>=3.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-ra"
markers = [
    "timing: timing assertions need external capture before final validation",
    "hardware: needs a TinyG on --port (applied automatically to tests using the tg fixture)",
    "motion: moves axes; skipped unless --allow-motion",
    "resets_board: resets the board (^X)",
    "persists: writes EEPROM; the session restores settings afterwards",
    "destructive: flashing or $defa; skipped unless --allow-destructive",
    "ice: needs the Atmel-ICE on the PDI header; skipped unless --ice",
    "timing: timing-pending until independently confirmed by external capture",
    "diagnostic: investigation test that records observations; skipped unless --diagnostics",
    "streaming: streams whole G-code files with each flow-control mode; skipped unless --streaming",
    "large_travel: needs ~110 mm of free X/Y travel; skipped unless --large-travel",
    "profile(*names): config profiles (tests/hil/config/profiles) layered for this test",
    "matrix(*names): config matrices (tests/hil/config/matrices); one run per combination",
    "settings(**tokens): inline settings for this test (prefer a profile)",
    "dialect(*names): run only on these firmware dialects (d440 = master 440.x, d449 = edge 449.x)",
    "bug(uid, on=...): known bug from docs/audit (E001-E139); expected to fail (strict) on the listed dialects",
]
